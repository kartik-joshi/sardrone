[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sardrone"
version = "0.1.0"
description = "Search-and-rescue drone in simulation: MCAP episodes viewed in FiftyOne"
requires-python = ">=3.11"
# Everything needed to WRITE an episode (no simulator, no viewer).
dependencies = [
    "foxglove-sdk>=0.31",  # writes MCAP with Foxglove protobuf schemas
    "pillow>=10",          # JPEG encoding for camera frames
    "pyyaml>=6",           # the variation matrix
    "mcap>=1.2",           # reads episodes back (frame extraction, tests)
    "mcap-protobuf-support>=0.5",
    "numpy>=1.26",         # detection metrics
    "scipy>=1.11",         # optimal matching in the tracker
]

[project.optional-dependencies]
# Tests read episodes back with the independent pure-Python MCAP reader.
dev = ["pytest>=8"]
# Talking to PX4. v4 is the native binding; its API differs from mavsdk<4.
fly = ["mavsdk>=4.2,<5"]
# The viewer. Large (about 900 MB installed, bundles MongoDB).
view = ["fiftyone[multimodal]>=1.19"]
# Embeddings and the open-vocabulary auto-labeler (Phase 2E). About 1 GB.
ml = ["torch>=2.4", "torchvision>=0.19", "transformers>=4.45", "umap-learn>=0.5"]
# The mission agent's language model (Phase 4A). Only needed for MODEL=cohere.
agent = ["cohere>=5.13"]
# The detector (Phase 3) is Ultralytics YOLO, AGPL-3.0. It is NOT listed here
# on purpose: it depends on opencv-python, which clashes with the
# opencv-python-headless that FiftyOne installs. `make smoke-train` installs
# it without dependencies (see the Makefile).

[tool.setuptools.packages.find]
include = ["sardrone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Third-party noise from FiftyOne and its dependencies, not from this project.
filterwarnings = [
    "ignore::DeprecationWarning:fiftyone.*",
    "ignore::DeprecationWarning:mongoengine.*",
    "ignore::DeprecationWarning:eta.*",
]
