# v13: v7's settings (randomized worlds, 1 to 3 vehicles) with content: rich:
# real vehicle meshes instead of box-built cars, 3 to 8 rock meshes, and two
# more bodies (walking adult, child). Same sampling seed as v7, so the worlds
# differ only in the new content. Issue #4.
#     make batch MATRIX=configs/v13.yaml
defaults:
  area_m: 60
  camera_pitch_deg: 45
  randomize: true
  content: rich

samples:
  - prefix: rich
    count: 30
    seed: 31
    world: [meadow, forest_edge, park]
    people: [1, 2, 3, 4, 5]
    occlusion: [none, none, partial]
    time_of_day: [noon, golden_hour, dusk]
    altitude_m: [15, 25, 40]
    vehicles: [1, 2, 3]
